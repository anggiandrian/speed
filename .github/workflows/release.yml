name: Build Speedhack (32-bit Nightly)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build DLL
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Check Folder Structure
        shell: powershell
        run: ls -R

      # UBAH KE NIGHTLY: Karena library 'retour' membutuhkan fitur unboxed_closures & tuple_trait
      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-i686-pc-windows-msvc
          target: i686-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Version.dll
        shell: powershell
        run: |
          $env:PROXY_DLL = "version.dll"
          # Kita gunakan 'cargo +nightly' untuk memastikan menggunakan toolchain nightly
          cargo +nightly build --release --target i686-pc-windows-msvc

      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts"
          if (Test-Path "target/i686-pc-windows-msvc/release/version.dll") {
            Copy-Item "target/i686-pc-windows-msvc/release/version.dll" -Destination "artifacts/version.dll"
          } else {
            Write-Error "DLL tidak ditemukan! Build gagal."
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speedhack-Rust-32bit-Nightly
          path: artifacts/version.dll
